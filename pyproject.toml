[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findit"
version = "0.1.0"
description = "Xiaohongshu matchmaker MVP - find genuine dating prospects and generate personalized icebreakers"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
findit-crawl = "findit.crawler.runner:main"
findit-crawler-service = "findit.services.crawler_service:main"
findit-bot = "findit.bot.app:main"
findit-pipeline = "findit.pipeline:main"

[tool.setuptools.packages.find]
include = ["findit*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
